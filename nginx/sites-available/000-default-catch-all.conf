# Default catch-all server block
#
# This block absorbs requests that do not match any named server_name.
# It prevents nginx from emitting "conflicting server name" warnings caused
# by the stock /etc/nginx/sites-enabled/default file, which should be
# removed (see README). Keeping this file as the lexicographically first
# entry (000-) ensures it is loaded before other blocks, so it becomes the
# effective default_server on both ports.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Return 444 (no response) for unrecognised hosts to deter scanners
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # Self-signed fallback certificate; replace with a real cert path if desired
    ssl_certificate /etc/letsencrypt/live/festas-builds.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/festas-builds.com/privkey.pem;

    # Return 444 (no response) for unrecognised hosts to deter scanners
    return 444;
}
